<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ronald's Radio</title>

    <!-- PWA / App Logo Instellingen -->
    <link rel="icon" type="image/png" href="Opstart.png">
    <link rel="apple-touch-icon" href="Opstart.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ronald Radio">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.8rem;
            color: #1db954;
        }

        .station-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 600px;
        }

        .station-card {
            background-color: #1e1e1e;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .station-card:active {
            transform: scale(0.96);
        }

        .station-card.active {
            border-color: #1db954;
            background-color: #282828;
        }

        .station-card img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 8px;
            margin-bottom: 10px;
            background-color: #000;
        }

        .station-card h3 {
            font-size: 1rem;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .player-bar {
            width: 100%;
            max-width: 600px;
            background-color: #1e1e1e;
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            text-align: center;
        }

        .now-playing {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #b3b3b3;
            height: 1.4em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .play-btn {
            background-color: #1db954;
            color: #000;
            border: none;
            width: 65px;
            height: 65px;
            border-radius: 50%;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(29, 185, 84, 0.4);
        }

        .tools-section {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #333;
            font-size: 0.9rem;
        }

        .tool-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .tool-group input, .tool-group select {
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            padding: 5px 8px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .tool-btn {
            background-color: #333;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .tool-btn.active-alarm {
            background-color: #e74c3c;
        }

        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .volume-container input[type=range] {
            width: 70%;
            accent-color: #1db954;
        }

        .ios-notice {
            font-size: 0.75rem;
            color: #777;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ronald's Radio</h1>
    </header>

    <div class="station-grid" id="stationGrid"></div>

    <div class="player-bar">
        <div class="now-playing" id="nowPlaying">Kies een zender om te luisteren</div>
        
        <div class="controls">
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
        </div>

        <div class="volume-container">
            <span>🔈</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="1" oninput="setVolume(this.value)">
            <span>🔊</span>
        </div>
        <div class="ios-notice">Gebruik de fysieke knoppen aan de zijkant van je iPhone voor volumeregeling</div>

        <!-- Wekker en Slaaptimer -->
        <div class="tools-section">
            <div class="tool-group">
                <label>⏰ Wekker</label>
                <div style="display: flex; gap: 5px;">
                    <input type="time" id="alarmTime">
                    <button class="tool-btn" id="alarmBtn" onclick="toggleAlarm()">Zet</button>
                </div>
            </div>

            <div class="tool-group">
                <label>⏳ Slaaptimer</label>
                <div style="display: flex; gap: 5px;">
                    <select id="sleepMinutes">
                        <option value="15">15 min</option>
                        <option value="30">30 min</option>
                        <option value="45">45 min</option>
                        <option value="60">60 min</option>
                    </select>
                    <button class="tool-btn" id="timerBtn" onclick="toggleSleepTimer()">Start</button>
                </div>
            </div>
        </div>
    </div>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        // ALLE 8 VASTE ZENDERS
        const stations = [
            {
                name: "Radio 10",
                stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO10.mp3",
                logo: "radio10.png"
            },
            {
                name: "BNR Nieuwsradio",
                stream: "https://stream.bnr.nl/bnr_mp3_128_20",
                logo: "bnr.png"
            },
            {
                name: "NPO Radio 2",
                stream: "https://icecast.omroep.nl/radio2-bb-mp3",
                logo: "nporadio2.png"
            },
            {
                name: "Radio Veronica",
                stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/VERONICA.mp3",
                logo: "veronica.png"
            },
            {
                name: "Radio 538",
                stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO538.mp3",
                logo: "radio538.png"
            },
            {
                name: "Qmusic",
                stream: "https://icecast-qmusicnl-cdp.triple-it.nl/Qmusic_nl_live.mp3",
                logo: "qmusic.png"
            },
            {
                name: "Sky Radio",
                stream: "https://playerservices.streamtheworld.com/api/livestream-redirect/SKYRADIO.mp3",
                logo: "skyradio.png"
            },
            {
                name: "NPO Radio 1",
                stream: "https://icecast.omroep.nl/radio1-bb-mp3",
                logo: "nporadio1.png"
            }
        ];

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const nowPlaying = document.getElementById('nowPlaying');
        let currentStationIndex = -1;

        // Wekker en Timer variabelen
        let alarmTargetTime = null;
        let alarmInterval = null;
        let sleepTimerTimeout = null;

        function loadStations() {
            const grid = document.getElementById('stationGrid');
            grid.innerHTML = '';

            stations.forEach((station, index) => {
                const card = document.createElement('div');
                card.className = `station-card ${index === currentStationIndex ? 'active' : ''}`;
                card.onclick = () => selectStation(index);

                card.innerHTML = `
                    <img src="${station.logo}" onerror="this.src='Opstart.png';" alt="${station.name}">
                    <h3>${station.name}</h3>
                `;
                grid.appendChild(card);
            });
        }

        function selectStation(index) {
            currentStationIndex = index;
            const station = stations[index];
            
            audio.src = station.stream;
            audio.play().catch(e => {
                console.log("Afspelen mislukt:", e);
                nowPlaying.innerText = "Fout bij afspelen van " + station.name;
            });
            
            playBtn.innerText = '⏸';
            nowPlaying.innerText = 'Aan het spelen: ' + station.name;

            loadStations();
        }

        function togglePlay() {
            if (currentStationIndex === -1) {
                selectStation(0);
                return;
            }

            if (audio.paused) {
                audio.play();
                playBtn.innerText = '⏸';
            } else {
                audio.pause();
                playBtn.innerText = '▶';
            }
        }

        function setVolume(val) {
            audio.volume = val;
        }

        // --- Wekker Logica ---
        function toggleAlarm() {
            const btn = document.getElementById('alarmBtn');
            const timeInput = document.getElementById('alarmTime').value;

            if (alarmTargetTime) {
                // Zet wekker uit
                alarmTargetTime = null;
                clearInterval(alarmInterval);
                btn.innerText = "Zet";
                btn.classList.remove('active-alarm');
                alert("Wekker uitgezet.");
            } else {
                if (!timeInput) {
                    alert("Kies eerst een wekkertijd!");
                    return;
                }
                alarmTargetTime = timeInput;
                btn.innerText = "Anuleer";
                btn.classList.add('active-alarm');
                
                // Check elke seconde of de tijd bereikt is
                alarmInterval = setInterval(() => {
                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const currentTime = `${hours}:${minutes}`;

                    if (currentTime === alarmTargetTime) {
                        if (currentStationIndex === -1) currentStationIndex = 0;
                        selectStation(currentStationIndex);
                        toggleAlarm(); // Schakel wekker uit na afgaan
                    }
                }, 1000);

                alert(`Wekker gezet op ${alarmTargetTime}!`);
            }
        }

        // --- Slaaptimer Logica ---
        function toggleSleepTimer() {
            const btn = document.getElementById('timerBtn');
            const minutes = parseInt(document.getElementById('sleepMinutes').value);

            if (sleepTimerTimeout) {
                clearTimeout(sleepTimerTimeout);
                sleepTimerTimeout = null;
                btn.innerText = "Start";
                btn.style.backgroundColor = "#333";
                alert("Slaaptimer geannuleerd.");
            } else {
                btn.innerText = "Stop";
                btn.style.backgroundColor = "#e74c3c";
                
                sleepTimerTimeout = setTimeout(() => {
                    audio.pause();
                    playBtn.innerText = '▶';
                    nowPlaying.innerText = "Slaaptimer afgelopen (gestopt)";
                    toggleSleepTimer();
                }, minutes * 60 * 1000);

                alert(`Slaaptimer ingesteld op ${minutes} minuten.`);
            }
        }

        loadStations();
    </script>
</body>
</html>
