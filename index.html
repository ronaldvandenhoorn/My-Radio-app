<!DOCTYPE html>

<html lang="nl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mijn Radio</title>



    <style>

        body {

            background-color: #121212;

            color: #ffffff;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            margin: 0;

            padding: 15px;

            display: flex;

            flex-direction: column;

            align-items: center;

        }



        h1 {

            color: #1db954;

            margin: 10px 0 20px 0;

        }



        /* Twee compacte knoppen naast elkaar */

        .grid {

            display: grid;

            grid-template-columns: repeat(2, 1fr);

            gap: 10px;

            width: 100%;

            max-width: 600px;

        }



        .station-btn {

            background-color: #1e1e1e;

            color: white;

            border: 2px solid #333;

            padding: 10px 6px;

            font-size: 0.9rem;

            font-weight: bold;

            border-radius: 12px;

            cursor: pointer;



            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;



            min-height: 105px;

            text-align: center;



            transition: all 0.2s ease;

        }



        .station-btn:hover,

        .station-btn:focus {

            background-color: #1db954;

            border-color: white;

            transform: scale(1.03);

            outline: none;

        }



        /* Logo */

        .station-logo {

            width: 70px;

            height: 52px;

            object-fit: contain;

            margin-bottom: 7px;

        }



        .station-icon {

            font-size: 36px;

            margin-bottom: 7px;

        }



        /* Toevoegen */

        .add-btn {

            background-color: #282828;

            color: #1db954;

            border: 2px dashed #1db954;

        }



        .add-btn:hover {

            background-color: #1db954;

            color: white;

            border-style: solid;

        }



        /* Pop-up */

        .modal {

            display: none;

            position: fixed;

            top: 50%;

            left: 50%;

            transform: translate(-50%, -50%);

            background-color: #282828;

            padding: 25px;

            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.8);

            z-index: 10;

            width: 85%;

            max-width: 400px;

        }



        .modal input {

            width: 100%;

            padding: 10px;

            margin: 8px 0 18px 0;

            background-color: #121212;

            border: 1px solid #444;

            color: white;

            border-radius: 5px;

            box-sizing: border-box;

        }



        .modal button {

            background-color: #1db954;

            color: white;

            border: none;

            padding: 11px;

            font-weight: bold;

            border-radius: 5px;

            cursor: pointer;

            width: 100%;

        }



        .modal .close-btn {

            background-color: #666;

            margin-top: 10px;

        }



        /* Player */

        .player-container {

            margin-top: 25px;

            background-color: #1e1e1e;

            padding: 15px;

            border-radius: 18px;



            display: flex;

            flex-direction: column;

            align-items: center;



            gap: 12px;



            width: 100%;

            max-width: 570px;

            box-sizing: border-box;



            box-shadow: 0 4px 15px rgba(0,0,0,0.5);

        }



        #current-station {

            font-weight: bold;

        }



        audio {

            width: 100%;

        }



        .airplay-btn {

            background-color: #333;

            color: white;

            border: none;

            padding: 10px 20px;

            border-radius: 20px;

            cursor: pointer;

            font-weight: bold;

            display: none;

        }



        /* Extra compact op iPhone */

        @media (max-width: 400px) {



            body {

                padding: 12px;

            }



            h1 {

                font-size: 1.6rem;

            }



            .grid {

                gap: 8px;

            }



            .station-btn {

                min-height: 100px;

                padding: 8px 5px;

                font-size: 0.85rem;

            }



            .station-logo {

                width: 62px;

                height: 47px;

            }

        }

    </style>

</head>



<body>



    <h1>📻 Mijn Radio</h1>



    <div class="grid" id="station-grid">



        <!-- NPO RADIO 1 -->

        <button

            class="station-btn"

            onclick="playRadio(

                'NPO Radio 1',

                'https://icecast.omroep.nl/radio1-bb-mp3'

            )">



            <img

                class="station-logo"

                src="https://upload.wikimedia.org/wikipedia/commons/thumb/0/0b/NPO\_Radio\_1\_logo\_2023.svg/512px-NPO\_Radio\_1\_logo\_2023.svg.png"

                alt="NPO Radio 1"

                onerror="this.style.display='none'"

            >



            <span>NPO Radio 1</span>

        </button>





        <!-- RADIO 538 -->

        <button

            class="station-btn"

            onclick="playRadio(

                'Radio 538',

                'https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO538.mp3'

            )">



            <img

                class="station-logo"

                src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/19/Radio\_538\_logo\_2024.svg/512px-Radio\_538\_logo\_2024.svg.png"

                alt="Radio 538"

                onerror="this.style.display='none'"

            >



            <span>Radio 538</span>

        </button>





        <!-- JOE NEDERLAND -->

        <button

            class="station-btn"

            onclick="playRadio(

                'JOE Nederland',

                'https://stream.joe.nl/joe/mp3'

            )">



            <img

                class="station-logo"

                src="https://upload.wikimedia.org/wikipedia/commons/thumb/4/40/JOE\_logo.svg/512px-JOE\_logo.svg.png"

                alt="JOE Nederland"

                onerror="this.style.display='none'"

            >



            <span>JOE Nederland</span>

        </button>





        <!-- NDR 2 HAMBURG -->

        <button

            class="station-btn"

            onclick="playRadio(

                'NDR 2 Hamburg',

                'https://icecast.ndr.de/ndr/ndr2/hamburg/mp3/128/stream.mp3'

            )">



            <img

                class="station-logo"

                src="https://upload.wikimedia.org/wikipedia/commons/thumb/7/75/NDR\_2\_Logo.svg/512px-NDR\_2\_Logo.svg.png"

                alt="NDR 2 Hamburg"

                onerror="this.style.display='none'"

            >



            <span>NDR 2 Hamburg</span>

        </button>





        <!-- TOEVOEGEN -->

        <button

            class="station-btn add-btn"

            onclick="openModal()">



            <span class="station-icon">➕</span>

            <span>Zender Toevoegen</span>



        </button>



    </div>





    <!-- POP-UP -->

    <div id="add-modal" class="modal">



        <h3>Nieuwe Zender Toevoegen</h3>



        <label>Naam van de radiozender:</label>



        <input

            type="text"

            id="station-name"

            placeholder="Bijv. Radio 10"

        >





        <label>Stream-link:</label>



        <input

            type="text"

            id="station-url"

            placeholder="https://..."

        >





        <label>Logo-link (optioneel):</label>



        <input

            type="text"

            id="station-logo"

            placeholder="https://...logo.png"

        >





        <button onclick="saveStation()">

            Opslaan

        </button>



        <button

            class="close-btn"

            onclick="closeModal()">



            Annuleren



        </button>



    </div>





    <!-- AUDIO PLAYER -->

    <div class="player-container">



        <span id="current-station">

            Kies een zender

        </span>



        <audio

            id="audio-player"

            controls

            playsinline>

        </audio>



        <button

            id="airplay-button"

            class="airplay-btn"

            onclick="triggerAirPlay()">



            📺 AirPlay



        </button>



    </div>





    <script>



        const player =

            document.getElementById('audio-player');



        const statusText =

            document.getElementById('current-station');



        const airplayBtn =

            document.getElementById('airplay-button');



        const grid =

            document.getElementById('station-grid');





        document.addEventListener(

            "DOMContentLoaded",

            loadSavedStations

        );





        /* RADIO AFSPELEN */



        function playRadio(name, url) {



            statusText.innerText =

                "Nu live: " + name;



            player.pause();



            player.src = url;



            player.load();



            player.play().catch(function(error) {



                console.error(error);



                statusText.innerText =

                    "Kan " + name + " niet afspelen";



            });



        }





        /* POP-UP OPENEN */



        function openModal() {



            document.getElementById(

                'add-modal'

            ).style.display = 'block';



        }





        function closeModal() {



            document.getElementById(

                'add-modal'

            ).style.display = 'none';



        }





        /* NIEUWE ZENDER OPSLAAN */



        function saveStation() {



            const name =

                document.getElementById(

                    'station-name'

                ).value.trim();



            const url =

                document.getElementById(

                    'station-url'

                ).value.trim();



            const logo =

                document.getElementById(

                    'station-logo'

                ).value.trim();





            if (name && url) {



                let stations =

                    JSON.parse(

                        localStorage.getItem(

                            'myRadioStations'

                        )

                    ) || [];





                stations.push({

                    name: name,

                    url: url,

                    logo: logo

                });





                localStorage.setItem(

                    'myRadioStations',

                    JSON.stringify(stations)

                );





                document.getElementById(

                    'station-name'

                ).value = '';



                document.getElementById(

                    'station-url'

                ).value = '';



                document.getElementById(

                    'station-logo'

                ).value = '';





                closeModal();



                loadSavedStations();



            } else {



                alert(

                    "Vul zowel de naam als de stream-link in!"

                );



            }



        }





        /* OPGESLAGEN ZENDERS LADEN */



        function loadSavedStations() {



            const customButtons =

                grid.querySelectorAll(

                    '.custom-station'

                );





            customButtons.forEach(

                button => button.remove()

            );





            const stations =

                JSON.parse(

                    localStorage.getItem(

                        'myRadioStations'

                    )

                ) || [];





            const addBtn =

                grid.querySelector(

                    '.add-btn'

                );





            stations.forEach(station => {



                const btn =

                    document.createElement(

                        'button'

                    );





                btn.className =

                    'station-btn custom-station';





                /* LOGO */



                if (station.logo) {



                    const img =

                        document.createElement(

                            'img'

                        );





                    img.className =

                        'station-logo';



                    img.src =

                        station.logo;



                    img.alt =

                        station.name;





                    img.onerror =

                        function() {



                            this.remove();



                            const icon =

                                document.createElement(

                                    'div'

                                );



                            icon.className =

                                'station-icon';



                            icon.innerText =

                                '📻';





                            btn.insertBefore(

                                icon,

                                btn.firstChild

                            );



                        };





                    btn.appendChild(img);



                } else {



                    const icon =

                        document.createElement(

                            'div'

                        );





                    icon.className =

                        'station-icon';



                    icon.innerText =

                        '📻';





                    btn.appendChild(icon);



                }





                /* NAAM */



                const label =

                    document.createElement(

                        'span'

                    );





                label.innerText =

                    station.name;





                btn.appendChild(label);





                /* AFSPELEN */



                btn.onclick =

                    function() {



                        playRadio(

                            station.name,

                            station.url

                        );



                    };





                grid.insertBefore(

                    btn,

                    addBtn

                );



            });



        }





        /* AIRPLAY */



        if (

            window.WebKitPlaybackTargetAvailabilityEvent

        ) {



            player.addEventListener(

                'webkitplaybacktargetavailabilitychanged',

                function(event) {



                    if (

                        event.availability ===

                        'available'

                    ) {



                        airplayBtn.style.display =

                            'block';



                    }



                }

            );



        }





        function triggerAirPlay() {



            if (

                player.webkitShowPlaybackTargetPicker

            ) {



                player.webkitShowPlaybackTargetPicker();



            }



        }



    </script>



</body>

</html>
